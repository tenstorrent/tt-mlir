[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.2", "dynamic-metadata>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "tt-crank"
version = "0.1.0"
description = "Compiler & runtime frontend for Tenstorrent hardware"
requires-python = "==3.12.*"
# Read from requirements.txt by the provider below, so the pins live in one
# greppable text file that `uv pip install -r` and the wheel metadata share.
dynamic = ["dependencies"]

[project.scripts]
tracy = "tracy.__main__:main"
tt-crank-install-sfpi = "tt_crank.install_sfpi:main"

# Reads requirements.txt into [project.dependencies] above, one PEP 508 entry per
# line. Dev-only pins live in requirements-dev.txt and never reach metadata.
[[tool.dynamic-metadata]]
provider = "dynamic_metadata.from_file"
field = "dependencies"
path = "requirements.txt"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.source-dir = "../"
wheel.packages = ["python/tt_crank", "python/tracy", "python/ttnn"]
editable.mode = "redirect"
build.targets = ["tt_crank_python"]

# Editable/dev install: reuse tt-mlir's build tree and build/install only the
# Python extension; its RPATH resolves the other libs from the build tree.
[[tool.scikit-build.overrides]]
if.state = "^(metadata_)?editable$"
cmake.define.TTMLIR_ENABLE_CRANK = "ON"
build-dir = "../build"
install.components = ["tt_crank_python"]

# Wheel-specific flags, appended onto the defines above (without `inherit` an
# override replaces the whole table).
[[tool.scikit-build.overrides]]
if.state = "^(metadata_)?wheel$"
inherit.cmake.define = "append"
cmake.build-type = "Release"
cmake.args = ["-GNinja"]
cmake.define.TTMLIR_ENABLE_CRANK = "ON"
cmake.define.TT_CRANK_BUILD_TESTS = "OFF"
cmake.define.CMAKE_CXX_COMPILER_LAUNCHER = "ccache"
cmake.define.CMAKE_C_COMPILER = "clang"
cmake.define.CMAKE_CXX_COMPILER = "clang++"
install.components = ["wheel_payload"]
# Separate cmake dir so wheel builds don't mix with the dev build.
build-dir = "build_wheel"
# Drop the fmt/spdlog dev artifacts that tt-logger's FetchContent subprojects
# install to the platlib root (headers + static .a + cmake/pkgconfig). They serve
# no runtime purpose and would otherwise land in site-packages/{include,lib}.
# Leading "/" anchors to the wheel root so this can NOT match tt_crank/lib (our
# intentional bundled-.so dir).
wheel.exclude = ["/include/**", "/lib/**"]

# Skip uv's default PEP 517 build isolation for this package. We need
# `import torch` at configure time (to discover libtorch's cmake prefix), and
# torch is too heavy to download into a sandboxed build env. The caller's venv
# has torch as a runtime dep; reusing it for the build is the natural fit.
[tool.uv]
no-build-isolation-package = ["tt-crank"]
