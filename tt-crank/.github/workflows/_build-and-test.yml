name: _build-and-test

on:
  workflow_call:
    inputs:
      sim:
        type: boolean
        default: false

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: tag
        run: |
          TAG=$(cd third_party/tt-mlir && bash .github/get-docker-tag.sh)
          echo "image=ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:$TAG" >> $GITHUB_OUTPUT

  reset-device:
    if: ${{ !inputs.sim }}
    runs-on: [self-hosted, "${{ inputs.sim && 'compute' || 'qb' }}"]
    steps:
      - name: Reset device
        run: tt-smi -r

      - name: Show device info
        run: tt-smi -s --snapshot_no_tty

  build-and-test:
    needs: [resolve-image, reset-device]
    if: ${{ !cancelled() && needs.resolve-image.result == 'success' && needs.reset-device.result != 'failure' }}
    runs-on: [self-hosted, "${{ inputs.sim && 'compute' || 'qb' }}"]
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      options: ${{ inputs.sim && '' || '--device /dev/tenstorrent -v /dev/hugepages-1G:/dev/hugepages-1G' }}
      volumes:
        - /opt/cpm-cache:/cpm-cache
      env:
        CPM_SOURCE_CACHE: /cpm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ runner.os }}

      - name: Build (debug)
        shell: bash
        run: |
          source venv/activate
          ./scripts/build debug

      - name: Install torch backend
        shell: bash
        run: |
          source venv/activate
          ./scripts/install-py

      - name: Unit Test
        shell: bash
        run: |
          source venv/activate
          ./scripts/test ${{ inputs.sim && 'sim' || '' }}

      - name: Pytest Test
        shell: bash
        run: |
          source venv/activate
          pytest tests/python ${{ inputs.sim && '--sim' || '' }}
