name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: tag
        run: |
          TAG=$(cd third_party/tt-mlir && bash .github/get-docker-tag.sh)
          echo "image=ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:$TAG" >> $GITHUB_OUTPUT

  build-and-test:
    needs: resolve-image
    runs-on: [self-hosted, compute]
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      volumes:
        - /opt/cpm-cache:/cpm-cache
      env:
        CPM_SOURCE_CACHE: /cpm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ runner.os }}

      - name: Build (debug)
        shell: bash
        run: |
          source venv/activate
          ./scripts/build debug

      - name: Install torch backend
        shell: bash
        run: |
          source venv/activate
          ./scripts/install-py

      - name: Unit Test (sim)
        shell: bash
        run: |
          source venv/activate
          ./scripts/test sim

      - name: Pytest Test (sim)
        shell: bash
        run: |
          source venv/activate
          pytest tests/python --sim
