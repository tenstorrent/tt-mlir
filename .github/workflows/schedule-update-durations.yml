name: Update Test Durations

# This workflow updates (builder) test durations based on the latest push workflow runs.
# It processes the JUnit XML reports from the last successful push workflows,
# calculates the test durations, and creates a pull request to update the `.test_durations/{arch}` file.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  update_test_durations:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write # OSPO Vault sign-in only
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Process test durations from latest workflows
        id: get-test-durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"

          get_test_results_from_wf() {
            local wf_name="$1"
            local conclusions="$2"
            local num=5

            # get json of the last $num workflow runs
            gh run list --workflow $wf_name -R $repo -b main -e push -L $num --status completed --json attempt,conclusion,databaseId >runs.json

            counter=0
            while true; do
              # Check the status of 'conclusion'
              conclusion=$(jq -r ".[$counter].conclusion" runs.json)

              if echo "$conclusions" | grep -q -w "$conclusion"; then
                break
              else
                ((++counter))

                # Exit if the counter reaches $num
                if [ $counter -ge $num ]; then
                  echo "ERROR: Did not found good workflow within the last $num. Exiting."
                  exit 1
                fi
              fi
            done
            curr_wf_id=$(jq -r ".[$counter].databaseId" runs.json)
            curr_wf_att=$(jq -r ".[$counter].attempt" runs.json)
            echo "curr_$3_wf_link=https://github.com/$repo/actions/runs/$curr_wf_id/attempts/$curr_wf_att" >> "$GITHUB_OUTPUT"
            rm -f runs.json

            gh run download $curr_wf_id --pattern "test-reports-*" -R $repo -D ${{runner.temp}}/reports
          }

          # get test results from the last successful push
          get_test_results_from_wf "on-push.yml" "success" "push"

          python .github/scripts/python/get_test_duration_from_junit_xmls.py ${{runner.temp}}/reports .test_durations

          echo "New test durations:"
          for file in .test_durations/*; do
            if [ -f "$file" ]; then
              echo "" >> $file
              echo "----- $(basename $file)"
              cat "$file"
            fi
          done

          echo "TODAY=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # ITSEC-354: the PR is pushed and opened with a short-lived token from
      # OSPO Vault (contents and pull requests on tt-mlir only, valid about one
      # hour). It is given only to scheduled runs on main.
      # This job does not approve or merge. A person reviews and merges the PR.
      - name: Manual run, no PR opened
        if: ${{ !(github.event_name == 'schedule' && github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          msg="The token that opens the test durations PR is given to scheduled runs on main only (ITSEC-354)."
          msg="$msg No PR was opened. A person can open it by hand, or ask OSPO in a ticket to allow manual runs."
          echo "::notice title=Durations PR not opened::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Get a token to open the PR
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        id: vault
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-mlir--main
          github-token: tenstorrent--tt-mlir--self-pr

      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: create-pr
        with:
          branch: test-durations-update
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          base: main
          commit-message: "Update test durations based on latest workflows ${{ steps.get-test-durations.outputs.TODAY }}"
          title: "Update test durations based on latest workflows ${{ steps.get-test-durations.outputs.TODAY }}"
          body: "This PR updates test durations based on latest push (${{ steps.get-test-durations.outputs.curr_push_wf_link }})"
          labels: tooling
          delete-branch: true
          token: ${{ steps.vault.outputs.token }}

      # Last use of the token is above. Leaving the tailnet cuts this job off from Vault.
      - name: Leave tailnet
        if: ${{ always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        run: sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }

      # No auto-merge and no approve step (ITSEC-354): this job does not approve
      # or merge. A person reviews and merges the durations PR.

      - name: Generate Summary
        run: |
          echo "## Test duration report" >> $GITHUB_STEP_SUMMARY
          echo "Used [Push](${{ steps.get-test-durations.outputs.curr_push_wf_link }})" >> $GITHUB_STEP_SUMMARY
          echo "Generated test durations in [Pull Request](${{ steps.create-pr.outputs.pull-request-url }})" >> $GITHUB_STEP_SUMMARY
