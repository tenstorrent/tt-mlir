# This workflow automates creation of uplift pull requests for model-explorer.
# Uplift PR is created daily to uplift the model-explorer version to the latest commit.

name: Nightly Model Explorer Uplift

on:
  schedule:
    - cron: '0 7 * * *'  # Runs at 07:00 UTC every day (staggered from tt-metal uplift)
  workflow_dispatch:  # Manual trigger

jobs:
  uplift-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OSPO Vault sign-in only

    env:
      MODEL_EXPLORER_PATH: tools/explorer
      VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set env variable for today's date
        run: |
          echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Extract current model-explorer version
        run: |
          CURRENT_MODEL_EXPLORER_VERSION=$(grep -oP 'set\(MODEL_EXPLORER_VERSION "\K[^"]+' tools/explorer/CMakeLists.txt)
          echo "CURRENT_MODEL_EXPLORER_VERSION=$CURRENT_MODEL_EXPLORER_VERSION" >> $GITHUB_ENV
          echo "Current model-explorer version: $CURRENT_MODEL_EXPLORER_VERSION"

      - name: Fetch latest SHA of model-explorer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_MODEL_EXPLORER_VERSION=$(gh api repos/tenstorrent/model-explorer/commits/main --jq '.sha')
          echo "LATEST_MODEL_EXPLORER_VERSION=$LATEST_MODEL_EXPLORER_VERSION" >> $GITHUB_ENV
          echo "Latest model-explorer version: $LATEST_MODEL_EXPLORER_VERSION"

      - name: Check if version needs updating
        id: check_version
        run: |
          if [ "${{ env.CURRENT_MODEL_EXPLORER_VERSION }}" != "${{ env.LATEST_MODEL_EXPLORER_VERSION }}" ]; then
            echo "VERSION_CHANGED=true" >> $GITHUB_ENV
            echo "Version has changed. Will create PR."
          else
            echo "VERSION_CHANGED=false" >> $GITHUB_ENV
            echo "Version has not changed. Skipping PR creation."
          fi

      - name: Update model-explorer reference in tools/explorer/CMakeLists.txt
        if: env.VERSION_CHANGED == 'true'
        run: |
          echo "Updating model-explorer to SHA: ${{ env.LATEST_MODEL_EXPLORER_VERSION }}"
          sed -i "s/set(MODEL_EXPLORER_VERSION \".*\")/set(MODEL_EXPLORER_VERSION \"${{ env.LATEST_MODEL_EXPLORER_VERSION }}\")/" tools/explorer/CMakeLists.txt

      # ITSEC-354: the PR is pushed and opened with a short-lived token from
      # OSPO Vault (contents and pull requests on tt-mlir only, valid about one
      # hour). It is given only to scheduled runs on main.
      # This job does not approve or merge. A person reviews and merges the PR.
      - name: Manual run, no PR opened
        if: ${{ env.VERSION_CHANGED == 'true' && !(github.event_name == 'schedule' && github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          msg="The token that opens the model-explorer uplift PR is given to scheduled runs on main only (ITSEC-354)."
          msg="$msg No PR was opened. To uplift now, a person opens a PR that sets MODEL_EXPLORER_VERSION"
          msg="$msg to $LATEST_MODEL_EXPLORER_VERSION, or ask OSPO in a ticket to allow manual runs."
          echo "::notice title=Uplift PR not opened::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Join tailnet (OSPO Vault)
        if: >-
          ${{ env.VERSION_CHANGED == 'true' && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_VAULT_OSPO_CLIENT_ID }}
          audience: ${{ vars.TS_VAULT_OSPO_AUDIENCE }}
          tags: tag:tt-gha-vault-ospo

      - name: Wait for Vault
        if: >-
          ${{ env.VERSION_CHANGED == 'true' && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 "${VAULT_URL}/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204" >/dev/null && exit 0
            sleep 2
          done
          echo "Vault ${VAULT_URL} did not become reachable over Tailscale" >&2
          exit 1

      - name: Get a token to open the PR
        if: >-
          ${{ env.VERSION_CHANGED == 'true' && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' }}
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: jwt-github
          role: tenstorrent--tt-mlir--main
          jwtGithubAudience: ${{ env.VAULT_URL }}
          exportEnv: false
          secrets: |
            github/token/tenstorrent--tt-mlir--self-pr token | SELF_PR_TOKEN

      - name: Create Pull Request
        if: >-
          ${{ env.VERSION_CHANGED == 'true' && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: create-pr
        with:
          branch: model-explorer-uplift
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          base: main
          commit-message: "Uplift model-explorer to ${{ env.LATEST_MODEL_EXPLORER_VERSION }} ${{ env.TODAY }}"
          title: "Uplift model-explorer to ${{ env.LATEST_MODEL_EXPLORER_VERSION }} ${{ env.TODAY }}"
          body: "This PR uplifts the model-explorer version in ${{ env.MODEL_EXPLORER_PATH }} to the latest commit ${{ env.LATEST_MODEL_EXPLORER_VERSION }} from previous version ${{ env.CURRENT_MODEL_EXPLORER_VERSION }}"
          labels: uplift
          delete-branch: true
          token: ${{ steps.vault.outputs.SELF_PR_TOKEN }}

      # Last use of the token is above. Leaving the tailnet cuts this job off from Vault.
      - name: Leave tailnet
        if: >-
          ${{ always() && env.VERSION_CHANGED == 'true' && github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main' }}
        run: sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }

      # No approve step (ITSEC-354): this job does not approve or merge.
      # A person reviews and merges the model-explorer uplift PR.
