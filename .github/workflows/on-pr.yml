name: On PR

on:
  workflow_dispatch:
    inputs:
      metal_override:
        description: 'Git SHA of commit in tenstorrent/tt-metal'
        required: false
        type: string
      builder_build:
        description: 'Run build on builder'
        required: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

permissions:
  # actions: read lets call-test.yml (job test-summary) read this run's
  # artifacts and job logs with the built-in token.
  actions: read
  checks: write
  packages: write
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: ./.github/workflows/call-pre-commit.yml
    secrets: inherit
  build-image:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
  prepare-run:
    uses: ./.github/workflows/call-prepare-run.yml
    with:
      builder_build: true
      build_all: ${{ github.event.pull_request.head.ref == 'uplift' || contains(github.event.pull_request.labels.*.name, 'build_all') || contains(github.event.pull_request.labels.*.name, 'uplift') }}
      min_timeout: ${{ (contains(github.event.pull_request.labels.*.name, 'build_all') || contains(github.event.pull_request.labels.*.name, 'uplift')) && 180 || 40 }}
    secrets: inherit
  release-build:
    needs: [ prepare-run, build-image ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-build-release.yml
    secrets: inherit
    with:
      metal_override: ${{ inputs.metal_override }}
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      runner: ${{ needs.prepare-run.outputs.runner }}
      sh_builder: ${{ fromJson(needs.prepare-run.outputs.sh_builder) }}
      component_matrix: ${{ needs.prepare-run.outputs.build_matrix }}
  debug-build:
    needs: [ prepare-run, build-image ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-build-debug.yml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-image.outputs.docker-image }}
  lint:
    needs: [ prepare-run, build-image ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-lint.yml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-image.outputs.docker-image }}
  test:
    needs: [ pre-commit, prepare-run, build-image, release-build ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-test.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      test_matrix: ${{ needs.prepare-run.outputs.test_matrix }}
      timeout: ${{ fromJson(needs.prepare-run.outputs.test_timeout) }}
  ttsim-test:
    needs: [ prepare-run, build-image, release-build ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-test-ttsim.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}

  # The downstream checks for the uplift PR (tt-xla, tt-forge-onnx) moved to
  # uplift-downstream-checks.yml. They start after this whole run succeeds.

  check-all-green:
    if: always()
    needs:
      - pre-commit
      - prepare-run
      - build-image
      - release-build
      - test
      - ttsim-test
      - debug-build
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Check if the needed jobs succeeded or failed
        id: check-jobs
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: debug-build, lint, release-build, test, ttsim-test
          jobs: ${{ toJSON(needs) }}
