name: Nightly run

on:
  workflow_dispatch:

permissions:
  checks: write
  packages: write
  contents: write

jobs:
  prepare-run:
    uses: ./.github/workflows/call-prepare-run.yml
    with:
      builder_build: true
      build_all: true
    secrets: inherit
  build-image:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      dockbuild: "all"
  crank-wheel-build:
    needs: [ prepare-run, build-image ]
    uses: ./.github/workflows/call-build-crank-wheel.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      runner: ${{ needs.prepare-run.outputs.runner }}
      sh_builder: ${{ fromJson(needs.prepare-run.outputs.sh_builder) }}
