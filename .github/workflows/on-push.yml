name: On push

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  # actions: read lets call-test.yml (job test-summary) read this run's
  # artifacts and job logs with the built-in token.
  actions: read
  checks: write
  packages: write
  contents: read

jobs:
  pre-commit:
    uses: ./.github/workflows/call-pre-commit.yml
    secrets: inherit
  check-tt-fatal:
    if: github.event_name == 'push'
    uses: ./.github/workflows/call-check-tt-fatal.yml
    secrets: inherit
  build-image:
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit
    with:
      dockbuild: "all"
  prepare-run:
    uses: ./.github/workflows/call-prepare-run.yml
    with:
      builder_build: true
    secrets: inherit
  release-build:
    needs: [ prepare-run, build-image ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-build-release.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      runner: ${{ needs.prepare-run.outputs.runner }}
      sh_builder: ${{ fromJson(needs.prepare-run.outputs.sh_builder) }}
      component_matrix: ${{ needs.prepare-run.outputs.build_matrix }}
  debug-build:
    needs: [ prepare-run, build-image ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-build-debug.yml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-image.outputs.docker-image }}
  test:
    needs: [ prepare-run, build-image, release-build ]
    if: needs.prepare-run.outputs.skip_build != 'true'
    uses: ./.github/workflows/call-test.yml
    secrets: inherit
    with:
      docker_image: ${{ needs.build-image.outputs.docker-image }}
      test_matrix: ${{ needs.prepare-run.outputs.test_matrix }}
      timeout: ${{ fromJson(needs.prepare-run.outputs.test_timeout) }}
  save-durations:
    needs: test
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    permissions: {}
    steps:
      # ITSEC-354: this step wrote the repository variable test_durations with a
      # stored token, which was deleted. No token may write repository variables,
      # so the step is skipped and the variable keeps its last value. The
      # durations of this run are still in its "test-durations-*" artifacts.
      # Follow-up for the owners: keep the durations as an artifact or a cache
      # entry and read them from there in call-prepare-run.yml.
      - name: Set test durations (skipped, see comment)
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=Test durations not saved::test_durations is not updated (ITSEC-354). Owners: store durations as an artifact or cache entry."
  docs:
    if: github.ref == 'refs/heads/main'
    needs: build-image
    # pages and id-token only for the docs deploy, not for every job (ITSEC-354).
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/call-build-docs.yml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-image.outputs.docker-image }}
