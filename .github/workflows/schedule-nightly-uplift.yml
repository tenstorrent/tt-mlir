# This workflow automates creation of uplift pull requests.
# Uplift PR is created daily to uplift the submodule to the latest version.

name: Nightly Uplift

on:
  schedule:
    - cron: '0 6 * * *'  # Runs at 06:00 UTC every day
  workflow_dispatch:  # Manual trigger
    inputs:
      branch_name:
        description: 'Branch name for the uplift PR'
        required: false
        type: string
        default: 'uplift'
      custom_metal_commit_hash:
        description: '(optional) Custom commit hash for tt-metal to point uplift branch to. Default to current tip of metal main. Does not permit metal version downgrade or non-metal-main commit.'
        required: false
        type: string
      create_draft_pr:
        description: 'Create the PR in draft mode'
        required: false
        type: boolean
        default: false

jobs:
  uplift-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OSPO Vault sign-in only

    env:
      TT_METAL_SUBMODULE_PATH: third_party/tt-metal
      VAULT_URL: https://vault-ospo.eng-svc.aws.tenstorrent.com

    steps:
      # This job can sign in to OSPO Vault. Inputs of a manual run are checked
      # here, before any step uses them.
      - name: Check inputs
        env:
          IN_METAL: ${{ inputs.custom_metal_commit_hash }}
          IN_BRANCH: ${{ inputs.branch_name || 'uplift' }}
        run: |
          set -euo pipefail
          if [[ -n "$IN_METAL" && ! "$IN_METAL" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::custom_metal_commit_hash must be a hex commit id (7 to 40 characters)."
            exit 1
          fi
          if [[ ! "$IN_BRANCH" =~ ^[A-Za-z0-9._/-]{1,100}$ || "$IN_BRANCH" == "main" ]]; then
            echo "::error::branch_name is not allowed."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set env variable for today's date
        run: |
          echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Check if branch already exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ inputs.branch_name || 'uplift' }}
        run: |
          # Allow overwrites for the default "uplift" branch
          if [ "$BRANCH_NAME" = "uplift" ]; then
            echo "Using default 'uplift' branch. Overwrites are allowed."
            exit 0
          fi

          # For custom branch names, exit if the branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::Branch '$BRANCH_NAME' already exists. Exiting to avoid overwriting."
            echo "::error::Please delete the existing branch first or choose a different branch name."
            exit 1
          fi
          echo "Branch '$BRANCH_NAME' does not exist. Proceeding with uplift."

      - name: Determine tt-metal version to uplift to
        env:
          GH_TOKEN: ${{ github.token }}
          IN_METAL: ${{ inputs.custom_metal_commit_hash }}
        run: |
          if [ -n "$IN_METAL" ]; then
            UPLIFTED_TT_METAL_VERSION="$IN_METAL"
            echo "Using custom tt-metal commit hash: $UPLIFTED_TT_METAL_VERSION"
          else
            UPLIFTED_TT_METAL_VERSION=$(gh api repos/tenstorrent/tt-metal/commits/main --jq '.sha')
            echo "Using latest tt-metal commit from main: $UPLIFTED_TT_METAL_VERSION"
          fi
          # Later steps paste this value into commands: allow a hex commit id only.
          if [[ ! "$UPLIFTED_TT_METAL_VERSION" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Unexpected tt-metal commit id: $UPLIFTED_TT_METAL_VERSION"
            exit 1
          fi
          echo "UPLIFTED_TT_METAL_VERSION=$UPLIFTED_TT_METAL_VERSION" >> $GITHUB_ENV

      - name: Validate no downgrade + using main when using custom commit hash for safety
        if: ${{ inputs.custom_metal_commit_hash }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TT_METAL_VERSION_REF=$(grep 'set(TT_METAL_VERSION' third_party/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          CURRENT_TT_METAL_VERSION=$(gh api repos/tenstorrent/tt-metal/commits/$CURRENT_TT_METAL_VERSION_REF --jq '.sha')
          echo "Current tt-metal version ref: $CURRENT_TT_METAL_VERSION_REF"
          echo "Current tt-metal version (resolved SHA): $CURRENT_TT_METAL_VERSION"
          echo "Custom tt-metal version: ${{ env.UPLIFTED_TT_METAL_VERSION }}"

          # Verify custom commit is on main metal branch
          MAIN_TIP=$(gh api repos/tenstorrent/tt-metal/commits/main --jq '.sha')
          COMPARE_TO_MAIN=$(gh api repos/tenstorrent/tt-metal/compare/${{ env.UPLIFTED_TT_METAL_VERSION }}...${MAIN_TIP} --jq '.status')

          if [ "$COMPARE_TO_MAIN" = "diverged" ]; then
            echo "::error::Custom commit hash ${{ env.UPLIFTED_TT_METAL_VERSION }} is not on the main branch"
            echo "::error::Please use a commit hash from the main branch."
            exit 1
          fi

          echo "Validation passed: Custom commit is on main branch"

          # Verify custom commit is not a downgrade from current version
          COMPARE_RESULT=$(gh api repos/tenstorrent/tt-metal/compare/${CURRENT_TT_METAL_VERSION}...${{ env.UPLIFTED_TT_METAL_VERSION }} --jq '.status')

          if [ "$COMPARE_RESULT" = "behind" ]; then
            echo "::error::Custom commit hash ${{ env.UPLIFTED_TT_METAL_VERSION }} would be a downgrade from current version $CURRENT_TT_METAL_VERSION (status: $COMPARE_RESULT)"
            echo "::error::Please use a commit hash that is ahead of the current version."
            exit 1
          fi

          echo "Validation passed: Custom commit is $COMPARE_RESULT current version"

      - name: Check for dependency file changes and update Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TT_METAL_VERSION_REF=$(grep 'set(TT_METAL_VERSION' third_party/CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          CURRENT_TT_METAL_VERSION=$(gh api repos/tenstorrent/tt-metal/commits/$CURRENT_TT_METAL_VERSION_REF --jq '.sha')
          echo "Current tt-metal version ref: $CURRENT_TT_METAL_VERSION_REF"
          echo "Current tt-metal version (resolved SHA): $CURRENT_TT_METAL_VERSION"

          # Fetch file hashes from current version
          CURRENT_INSTALL_DEPS_SHA=$(gh api repos/tenstorrent/tt-metal/contents/install_dependencies.sh?ref=$CURRENT_TT_METAL_VERSION --jq '.sha' 2>/dev/null || echo "not_found")
          CURRENT_SFPI_INFO_SHA=$(gh api repos/tenstorrent/tt-metal/contents/tt_metal/sfpi-info.sh?ref=$CURRENT_TT_METAL_VERSION --jq '.sha' 2>/dev/null || echo "not_found")
          CURRENT_SFPI_VERSION_SHA=$(gh api repos/tenstorrent/tt-metal/contents/tt_metal/sfpi-version?ref=$CURRENT_TT_METAL_VERSION --jq '.sha' 2>/dev/null || echo "not_found")
          CURRENT_EXALENS_VERSION_SHA=$(gh api repos/tenstorrent/tt-metal/contents/tools/triage/requirements.txt?ref=$CURRENT_TT_METAL_VERSION --jq '.sha' 2>/dev/null || echo "not_found")

          # Fetch file hashes from uplifted version
          LATEST_INSTALL_DEPS_SHA=$(gh api repos/tenstorrent/tt-metal/contents/install_dependencies.sh?ref=${{ env.UPLIFTED_TT_METAL_VERSION }} --jq '.sha' 2>/dev/null || echo "not_found")
          LATEST_SFPI_INFO_SHA=$(gh api repos/tenstorrent/tt-metal/contents/tt_metal/sfpi-info.sh?ref=${{ env.UPLIFTED_TT_METAL_VERSION }} --jq '.sha' 2>/dev/null || echo "not_found")
          LATEST_SFPI_VERSION_SHA=$(gh api repos/tenstorrent/tt-metal/contents/tt_metal/sfpi-version?ref=${{ env.UPLIFTED_TT_METAL_VERSION }} --jq '.sha' 2>/dev/null || echo "not_found")
          LATEST_EXALENS_VERSION_SHA=$(gh api repos/tenstorrent/tt-metal/contents/tools/triage/requirements.txt?ref=${{ env.UPLIFTED_TT_METAL_VERSION }} --jq '.sha' 2>/dev/null || echo "not_found")

          if [ "$CURRENT_INSTALL_DEPS_SHA" != "$LATEST_INSTALL_DEPS_SHA" ] || \
             [ "$CURRENT_SFPI_INFO_SHA" != "$LATEST_SFPI_INFO_SHA" ] || \
             [ "$CURRENT_EXALENS_VERSION_SHA" != "$LATEST_EXALENS_VERSION_SHA" ] || \
             [ "$CURRENT_SFPI_VERSION_SHA" != "$LATEST_SFPI_VERSION_SHA" ]; then
            # Update the commit hash in Dockerfile.base
            sed -i "s|ARG TT_METAL_DEPENDENCIES_COMMIT=.*|ARG TT_METAL_DEPENDENCIES_COMMIT=${{ env.UPLIFTED_TT_METAL_VERSION }}|" .github/Dockerfile.base
            DOCKERFILE_UPDATED="**Note** Dockerfile.base is modified due to dependency updates"
            echo "DOCKERFILE_UPDATED=$DOCKERFILE_UPDATED" >> $GITHUB_ENV
          fi

      - name: Update tt-metal reference in third_party/CMakeLists.txt
        run: |
          echo "Updating tt-metal to SHA: ${{ env.UPLIFTED_TT_METAL_VERSION }}"
          sed -i "s/set(TT_METAL_VERSION \".*\")/set(TT_METAL_VERSION \"${{ env.UPLIFTED_TT_METAL_VERSION }}\")/" third_party/CMakeLists.txt

      # ITSEC-354: the PR is pushed and opened with a short-lived token from
      # OSPO Vault (contents and pull requests on tt-mlir only, valid about one
      # hour). It is given only to scheduled runs on main.
      # This job does not approve or merge. A person reviews and merges the PR.
      - name: Manual run, no PR opened
        if: ${{ !(github.event_name == 'schedule' && github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          msg="The token that opens the uplift PR is given to scheduled runs on main only (ITSEC-354)."
          msg="$msg No PR was opened. To uplift now, a person opens a PR that sets TT_METAL_VERSION"
          msg="$msg to $UPLIFTED_TT_METAL_VERSION, or ask OSPO in a ticket to allow manual runs."
          echo "::notice title=Uplift PR not opened::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Join tailnet (OSPO Vault)
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_VAULT_OSPO_CLIENT_ID }}
          audience: ${{ vars.TS_VAULT_OSPO_AUDIENCE }}
          tags: tag:tt-gha-vault-ospo

      - name: Wait for Vault
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            curl -fsS --max-time 5 "${VAULT_URL}/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204" >/dev/null && exit 0
            sleep 2
          done
          echo "Vault ${VAULT_URL} did not become reachable over Tailscale" >&2
          exit 1

      - name: Get a token to open the PR
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_URL }}
          method: jwt
          path: jwt-github
          role: tenstorrent--tt-mlir--main
          jwtGithubAudience: ${{ env.VAULT_URL }}
          exportEnv: false
          secrets: |
            github/token/tenstorrent--tt-mlir--self-pr token | SELF_PR_TOKEN

      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: create-pr
        with:
          branch: ${{ inputs.branch_name || 'uplift' }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          base: main
          draft: ${{ inputs.create_draft_pr || false }}
          commit-message: "Uplift ${{ env.TT_METAL_SUBMODULE_PATH }} to ${{ env.UPLIFTED_TT_METAL_VERSION }} ${{ env.TODAY }}"
          title: "Uplift ${{ env.TT_METAL_SUBMODULE_PATH }} to ${{ env.UPLIFTED_TT_METAL_VERSION }} ${{ env.TODAY }}"
          body: |
            This PR uplifts the ${{ env.TT_METAL_SUBMODULE_PATH }} to the ${{ env.UPLIFTED_TT_METAL_VERSION }}

            ${{ env.DOCKERFILE_UPDATED }}

            ### Checklist
            - **Frontend CI passing links**
              - [ ] [tt-forge-onnx](https://github.com/tenstorrent/tt-forge-onnx/actions/workflows/on-pr.yml):
              - [ ] [tt-xla (full-mlir-uplift-qualification.json)](https://github.com/tenstorrent/tt-xla/actions/workflows/manual-test.yml):
            - **Follow-up Actions**
              - [ ] **Issues filed** to follow up on incomplete changes (if any):
              - [ ] **Frontend fix PRs** ready (if needed by this uplift):
          labels: uplift
          delete-branch: true
          token: ${{ steps.vault.outputs.SELF_PR_TOKEN }}

      # Last use of the token is above. Leaving the tailnet cuts this job off from Vault.
      - name: Leave tailnet
        if: ${{ always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        run: sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }

      # No approve step and no auto-merge (ITSEC-354): this job does not approve
      # or merge. A person reviews and merges the uplift PR.
